[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-share"
version = "0.1.0"
description = "Make a Linux machine show up in Windows' Network tab, and mount Windows shares, on any mainstream systemd distro."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
lan-share = "lan_share.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lan_share.vendor" = ["wsdd.py", "LICENSE-wsdd", "README.md"]
